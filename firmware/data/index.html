<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydro Tower Control Engine</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <h1>Hydro Tower Automation Hub</h1>
        <div style="display: flex; align-items: center; gap: 12px;">
            <span id="system-time">NTP Synchronizing...</span>
            <span>|</span>
            <a href="/update" style="color: #10b981; text-decoration: none; font-weight: bold;">OTA Update</a>
        </div>
    </header>

    <main class="container">
        <!-- Live System Alarms Box -->
        <div id="alarm-banner" class="banner hidden"></div>

        <!-- Live Metrics Grid -->
        <section class="card status-grid">
            <div class="metric">
                <span class="label">Room Temp</span>
                <span id="room-temp" class="value">--</span><span class="unit">°C</span>
            </div>
            <div class="metric">
                <span class="label">Room Humidity</span>
                <span id="room-humidity" class="value">--</span><span class="unit">%</span>
            </div>
            <div class="metric">
                <span class="label">Water Temp</span>
                <span id="water-temp" class="value">--</span><span class="unit">°C</span>
            </div>
            <div class="metric">
                <span class="label">Water Level</span>
                <span id="water-level" class="value">--</span><span class="unit">%</span>
            </div>
        </section>

        <!-- Dynamic Control Engine Overrides -->
        <!-- Dynamic Control Engine Overrides -->
        <section class="card">
            <h2>Manual Core Overrides</h2>
            <div class="control-row">
                <div>
                    <p>Pump Status: <strong id="pump-state">OFF</strong></p>
                    <button class="btn" onclick="sendOverride('ON')">Force Pump ON</button>
                    <button class="btn btn-danger" onclick="sendOverride('OFF')">Force Pump OFF</button>
                </div>
                <div>
                    <p>LED Spectrum Dimmer</p>
                    <!-- FIXED: De oude progress-bar is vervangen door een echte interactieve range-slider -->
                    <div class="slider-container">
                        <input type="range" id="light-slider" min="0" max="100" value="0" class="main-slider">
                    </div>
                    <span id="light-brightness-text">0%</span>
                </div>
            </div>
        </section>

        <!-- System Configuration Manager Form -->
        <section class="card">
            <h2>System Profiles Configuration</h2>
            <form id="config-form" onsubmit="saveSystemConfig(event)">
                <fieldset>
                    <legend>Photoperiod Schedule</legend>
                    <div class="form-group">
                        <label for="light_start">Start Time (HH:MM):</label>
                        <input type="text" id="light_start" pattern="[0-9]{2}:[0-9]{2}" required>
                    </div>
                    <div class="form-group">
                        <label for="light_end">End Time (HH:MM):</label>
                        <input type="text" id="light_end" pattern="[0-9]{2}:[0-9]{2}" required>
                    </div>
                    <div class="form-group">
                        <label for="fade_duration_min">Fade Window (Minutes):</label>
                        <input type="number" id="fade_duration_min" min="0" max="60" required>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Irrigation Timing Profile</legend>
                    <div class="form-group">
                        <label for="pump_on">Active Duration (Minutes):</label>
                        <input type="number" id="pump_on" min="1" max="60" required>
                    </div>
                    <div class="form-group">
                        <label for="pump_interval">Interval Window (Minutes):</label>
                        <input type="number" id="pump_interval" min="1" max="1440" required>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Failsafe Safety Thresholds</legend>
                    <div class="form-group">
                        <label for="min_water">Dry-Run Protection Lower Limit (%):</label>
                        <input type="number" id="min_water" min="5" max="100" step="0.1" required>
                    </div>
                </fieldset>

                <button type="submit" class="btn btn-save">Commit & Save Flash Profiles</button>
            </form>
        </section>
    </main>
   <script src="/js/main.js"></script>
</body>
</html>
